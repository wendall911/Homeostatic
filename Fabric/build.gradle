plugins {
    id 'idea'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

def actualVersion = version
version = "${minecraft_version}-${version}-FABRIC"
archivesBaseName = "${mod_id}"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings(loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${mappings_version}@zip")
    })

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":Common")

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-fabric", version: "${whitenoise_version}"
    include group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-fabric", version: "${whitenoise_version}"

    modApi "dev.architectury:architectury-fabric:${architectury_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    modCompileOnly "curse.maven:create_fabric-624165:${create_fabric_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    modCompileOnly "curse.maven:fabric_seasons-413523:${fabric_seasons_version}"
    modImplementation "vazkii.patchouli:Patchouli:${patchouli_version}-FABRIC-SNAPSHOT"
    modRuntimeOnly "curse.maven:simpletextoverlay-321283:${simpletextoverlay_fabric_version}"

    modLocalRuntime group: 'com.terraformersmc', name: 'modmenu', version: "${mod_menu_version}"

    if (System.getenv('DATA_GEN') != null) {
        // Datagen mods
    }
    else {
        // Runtime testing mods
        //modRuntimeOnly "curse.maven:-:${}"
        // This doesn't work for whatever reason. Such a strange port
        //modRuntimeOnly "curse.maven:create_fabric-624165:${create_fabric_version}"
        //modRuntimeOnly "curse.maven:more_food-874343:${more_food_fabric_version}"
        //modRuntimeOnly "curse.maven:farmers_delight-993166:5568031"
        //modRuntimeOnly "curse.maven:terrablender-565956:${terrablender_fabric_version}"
        //modRuntimeOnly "curse.maven:regions-659110:${regions_fabric_version}"
        //modRuntimeOnly "curse.maven:forge_config-547434:${forge_config_fabric_version}"
        //modRuntimeOnly "curse.maven:byg-1070751:${byg_fabric_version}"
        //modRuntimeOnly "curse.maven:tyg-962544:${tyg_fabric_version}"
        //modRuntimeOnly "curse.maven:corgilib-693313:${corgilib_fabric_version}"
        //modRuntimeOnly "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_fabric_version}"
        //modRuntimeOnly "curse.maven:crafttweaker-239197:${crafttweaker_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_bakery-1038130:${letsdo_bakery_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_beach-858691:${letsdo_beach_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_blooming-962885:${letsdo_blooming_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_brewery-1038106:${letsdo_brewery_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_candlelight-1038117:${letsdo_candlelight_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_herbal-951221:${letsdo_herbal_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_meadow-821483:${letsdo_meadow_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_farm-1038103:${letsdo_farm_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_vinery-704465:${letsdo_vinery_fabric_version}"
        //modRuntimeOnly "curse.maven:letsdo_wilder-1071657:${letsdo_wilder_fabric_version}"
    }
}

loom {
    if (project(":Common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":Common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        commonDatagen {
            client()
            vmArg "-D${mod_id}.common_datagen=1"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dfabric-api.datagen.output-dir=${file("../Common/src/generated/resources")}"
        }
        fabricDatagen {
            client()
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
        }
    }
}

def resourceTargets = ['fabric.mod.json', 'pack.mcmeta', '*.mixins.json']
def replaceProperties = [
    'version': actualVersion,
    'fabric_mc_version_range': fabric_mc_version_range,
    'license': license,
    'mod_id': mod_id,
    'mod_author': mod_author,
    'mod_description': mod_description,
    'mod_display_name': mod_display_name,
    'mod_name': mod_name,
    'fabric_loader_min_version': fabric_loader_min_version,
    'mod_credits': mod_credits,
    'java_version': java_version,
    'pack_format': pack_format,
    'whitenoise_range': whitenoise_range
]

processResources {
    from project(":Common").sourceSets.main.resources
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    replaceProperties.put 'project', project
    exclude '.cache'

    filesMatching(resourceTargets) {
        expand replaceProperties
    }

    from ('../Forge/src/generated/resources/') {
        exclude '**/recipes/*'
    }
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/Fabric/build/libs/${archivesBaseName}-${version}.jar"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.add('fabric')
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty("${curseforge_api_key_prop}")) {
        curseforge {
            accessToken = project.property("${curseforge_api_key_prop}")
            projectId = "${curseforge_id}"
            projectSlug = "${curseforge_slug}"
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('fabric-api')
            optional('jei')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks')
            optional('magical-psi-revival')
            optional('simpletextoverlay')
            optional('ready-player-fun')
            optional('survivalist-essentials')
            optional('tinkersurvival')
            optional('serene-seasons')
            optional('biomes-o-plenty')
            optional('oh-the-biomes-weve-gone')
            optional('croptopia')
            optional('farmers-delight-refabricated')
            optional('xercamod')
            optional('kitteh6660s-morecraft')
            optional('sophisticated-backpacks')
            optional('ecologics')
            optional('ars-nouveau')
            optional('sprout')
            optional('create-cafe')
            optional('fruit-trees')
            optional('leave-my-bars-alone')
            optional('create')
            optional('patchouli')
            optional('scuba-gear')
            optional('kobolds')
            optional('the-twilight-forest')
            optional('primal-winter')
            optional('more-food-xd')
            optional('terralith')
            optional('regions-unexplored')
            optional('lets-do-bakery-farm-charm-compat')
            optional('lets-do-brewery-farm-charm-compat')
            optional('lets-do-candlelight-farm-charm-compat')
            optional('lets-do-herbal-brews')
            optional('lets-do-meadow')
            optional('lets-do-farm-charm')
            optional('lets-do-vinery')
        }
    }
    if (project.hasProperty("${modrinth_api_key_prop}")) {
        modrinth {
            accessToken = project.property("${modrinth_api_key_prop}")
            projectId = "${modrinth_id}"
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('fabric-api')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks-mod')
            optional('magical-psi-revival')
            optional('simpletextoverlay')
            optional('ready-player-fun')
            optional('survivalist-essentials')
            optional('tinkersurvival')
            optional('create')
            optional('ecologics')
            optional('create-cafe')
            optional('scuba-gear')
            optional('farmers-delight-refabricated')
            optional('xercamod')
            optional('leave-my-bars-alone')
            optional('sprout')
            optional('patchouli')
            optional('jei')
            optional('oh-the-biomes-weve-gone')
            optional('kobolds')
            optional('primal-winter')
            optional('tinkers-construct')
            optional('fruitful-fun')
            optional('more-food-xd')
            optional('terralith')
            optional('regions-unexplored')
            optional('lets-do-bakery-farmcharm-compat')
            optional('lets-do-brewery-farmcharm-compat')
            optional('lets-do-candlelight-farmcharm-compat')
            optional('lets-do-herbalbrews')
            optional('lets-do-meadow')
            optional('lets-do-farm-charm')
            optional('lets-do-vinery')
        }
    }
    if (project.hasProperty("${discord_webhook_prop}")) {
        discord {
            webhookUrl = project.property("${discord_webhook_prop}")
            dryRunWebhookUrl = project.property("${discord_dryrun_webhook_prop}")
            username = "${mod_author}"
            content = changelog.map {
                "# A new version of ${mod_display_name} for Fabric ${minecraft_version} has been released! \n" + it
            }
        }
    }
}
