modLoader="javafml"
loaderVersion="${forge_version_range}"
license="${license}"
logoBlur=false
issueTrackerURL="${issue_tracker}"
logoFile="${mod_id}_icon.png"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    updateJSONURL="https://raw.githubusercontent.com/wendall911/Homeostatic/${mod_update_branch}/files/updates.json"
    authors="${mod_author}"
    credits="${mod_credits}"
    description='''
    ${mod_description}
    '''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${forge_mc_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.homeostatic]]
    modId="biomesoplenty"
    mandatory=false
    versionRange="[17.1.2,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.homeostatic]]
    modId="byg"
    mandatory=false
    versionRange="[2.0.1,)"
    ordering="NONE"
    side="BOTH"
